[package]
name = "bevy_symbios_audio"
version = "0.4.6"
edition = "2024"
authors = ["Janus"]
description = "Algorithmic audio generator for Bevy."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/bevy_symbios_audio"
keywords = ["audio", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development", "mathematics"]

# docs.rs builds every feature, so the egui editor's widgets and the CLI are
# documented whether or not a default build carries them.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
egui = ["dep:bevy_egui", "dep:web-time"]
# The `symbios-audio-cli` binary only. `clap` was a hard dependency of the
# library until 0.4 even though nothing outside `src/bin/` ever referenced
# it, so every consumer compiled the argument parser to get the plugin.
cli = ["dep:clap"]

[dependencies]
bevy = { version = "0.19", features = ["wav"] }
bevy_egui = { version = "0.41", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# Only the `Rng` / `SeedableRng` traits over a seeded ChaCha8Rng: nothing
# draws OS entropy, so the default os_rng / thread_rng features stay off
# (Overlands #1172, finding 70).
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
rayon = "1.11"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
symbios-audio = "0.2"
symbios-genetics = "0.2"
# Wall-clock seed source for the editor's "mutate" buttons; forwards to
# `std` on native and to the browser clock on wasm (std::time panics on
# wasm32-unknown-unknown). Only the egui editor needs it.
web-time = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.8"
bevy_egui = "0.41"
# The editor-glyph guard reads egui's embedded faces' charmaps (#52).
skrifa = "0.42.1"

[[bin]]
name = "symbios-audio-cli"
path = "src/bin/symbios_audio_cli.rs"
required-features = ["cli"]

# The integration suite execs the binary through `CARGO_BIN_EXE_...`, and
# Cargo still sets that variable when the binary was skipped for want of its
# features — pointing at a path that was never built. Without this line the
# suite compiles and then fails at run time with a bare `NotFound`, on every
# feature row that does not enable `cli`.
[[test]]
name = "cli"
required-features = ["cli"]

[[example]]
name = "patch_editor"
required-features = ["egui"]

[[example]]
name = "sequence_editor"
required-features = ["egui"]

[[example]]
name = "host_window"
required-features = ["egui"]

[[bench]]
name = "bake"
harness = false

[profile.bench]
debug = true

[lints.rust]
# Set by docs.rs only; see the attribute at the top of `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }
# The sibling crates' shared policy (Overlands #1172). Every public item is
# documented; the gate's `-D warnings` keeps it that way.
missing_docs = "warn"
